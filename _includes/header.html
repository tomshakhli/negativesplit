      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="10,5 10,47 97,26" fill="#1a1a1a"/>
        <polygon points="97,53 97,95 10,74" fill="#1a1a1a"/>
      </svg>
    </span>
  </a>
  <nav aria-label="Main">
    <ul class="nav-list">
      <li><a href="{{ '/#about' | relative_url }}">About</a></li>
      <li><a href="{{ '/#coaching' | relative_url }}">Coaching</a></li>
