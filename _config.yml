# Site settings
title: Negative Split Running
description: Friendly, personalised online and in-person running coaching for all levels. From your first parkrun to your fastest marathon.
author: Tom

# Production URL: used for canonical links and Open Graph
# If serving via custom domain (negativesplitrunning.co.uk), baseurl stays empty.
# If testing on USERNAME.github.io/REPO-NAME, set baseurl: "/REPO-NAME"
url: "https://www.negativesplitrunning.co.uk"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Notes: the writing section. Each file in _notes/ becomes a page.
# URLs keep the old Wix pattern (/post/the-file-name) so existing
# links and Google rankings carry over.
collections:
  notes:
    output: true
    permalink: /post/:name

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - HOW-TO-ADD-A-NOTE.md
  - vendor
  - .bundle
